name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve dependencies
        run: swift package resolve
      - name: Unit tests
        run: swift test
      - name: Web Billing integration flow
        run: swift test --filter EntitlementKitIntegrationTests
